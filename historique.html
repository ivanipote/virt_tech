<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique d'activité - VirtTech</title>
<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  --fond:#CED3D6;
  --surface:#D9E0E2;
  --logo-fond:#D2D7DA;
  --metal:#606A73;
  --metal-moyen:#515B64;
  --metal-fonce:#323F48;
  --ombre:#161F27;
  --blanc:#FFFFFF;
  --or:#D4AF37;
  --ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:var(--fond);color:var(--ombre);line-height:1.6;min-height:100vh;}
a:focus-visible,button:focus-visible{outline:3px solid var(--ombre);outline-offset:2px}

/* ===== ANIMATIONS D'AFFICHAGE (Comme sur l'accueil) ===== */
@keyframes monter{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.js .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease) var(--d,0s),transform .7s var(--ease) var(--d,0s)}
.js .reveal.g{transform:translateX(-34px)}
.js .reveal.z{transform:scale(.93)}
.js .reveal.vu{opacity:1;transform:none}

/* CONTENU DE LA PAGE */
.contenu{padding:30px 24px 80px;max-width:1000px;margin:0 auto;min-height: 60vh;}
h1 { text-align: center; color: var(--ombre); margin-bottom: 10px; font-size: 2rem; animation:monter .7s .1s var(--ease) backwards;}
p.sous-titre { text-align: center; color: var(--metal-fonce); margin-bottom: 40px; font-size: 1.1rem; animation:monter .7s .2s var(--ease) backwards;}

/* --- GRILLE DES CARTES --- */
.grille-historique {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

/* --- CARTES --- */
.carte-activite {
    background: var(--blanc);
    border: 2px solid var(--metal);
    border-radius: 20px;
    padding: 25px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 20px rgba(22,31,39,.1);
    /* Animation d'entrée */
    animation: monter 0.6s var(--ease) backwards;
}
.carte-activite:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 30px rgba(22,31,39,.2);
    border-color: var(--metal-fonce);
}
.carte-activite h3 {
    font-size: 1.4rem;
    color: var(--metal-fonce);
    margin-bottom: 10px;
}
.carte-activite p {
    color: var(--metal-moyen);
    font-size: 0.95rem;
}
.carte-activite .indice {
    margin-top: auto;
    padding-top: 15px;
    font-size: 0.8rem;
    font-weight: bold;
    color: var(--metal);
    text-transform: uppercase;
}
.carte-virtdev { border-top: 6px solid var(--or); }
.carte-virtdev h3 { color: var(--or); }

/* --- LE SLIDE (Panneau du bas) --- */
.slide-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(22,31,39,0.7); backdrop-filter: blur(3px);
    z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease;
}
.slide-overlay.ouvert { opacity: 1; visibility: visible; }

.slide-panel {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 85vh;
    background: var(--blanc); border-radius: 25px 25px 0 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5); z-index: 1001;
    transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.22, 0.8, 0.3, 1);
    display: flex; flex-direction: column;
}
.slide-panel.ouvert { transform: translateY(0); }

.slide-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 25px; background: var(--metal-fonce); color: var(--blanc);
    border-bottom: 3px solid var(--or); border-radius: 25px 25px 0 0;
    flex-shrink: 0;
}
.slide-header h3 { font-size: 1.3rem; margin: 0; }
.btn-fermer-slide {
    background: none; border: none; color: var(--blanc);
    font-size: 1.5rem; cursor: pointer; transition: 0.2s;
}
.btn-fermer-slide:hover { color: #ffb3b3; transform: scale(1.2); }

/* Le contenu du slide (SCROLLABLE et ANIMÉ) */
.slide-contenu {
    padding: 30px; overflow-y: auto; flex: 1; color: var(--metal-fonce);
}
.slide-contenu h4 { color: var(--metal-fonce); margin-top: 25px; margin-bottom: 10px; font-size: 1.15rem; border-bottom: 1px solid var(--surface); padding-bottom: 5px; }
.slide-contenu p { color: var(--metal-moyen); margin-bottom: 15px; }
.slide-contenu ul { margin-left: 20px; margin-bottom: 15px; color: var(--metal-moyen); }
.badge-gagnant { display: inline-block; background: var(--or); color: var(--ombre); padding: 5px 12px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; margin-bottom: 5px;}
.lien-resultats { display: inline-block; margin-top: 15px; color: var(--metal-fonce); font-weight: bold; text-decoration: none; border-bottom: 2px solid var(--or); }
.lien-resultats:hover { color: var(--or); }

/* Responsive */
@media(max-width:600px){
    .contenu{padding:20px 12px 30px;}
    .slide-panel { height: 90vh; }
    .slide-contenu { padding: 20px; }
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .reveal{opacity:1;transform:none}}
</style>
<link rel="stylesheet" href="header.css">
</head>
<body>

<div class="contenu">
    <h1>Historique des Activités</h1>
    <p class="sous-titre">Retrouvez tous les événements et projets réalisés par la communauté VirtTech.</p>

    <div class="grille-historique">
        
        <!-- CARTE VIRT_DEV -->
        <div class="carte-activite carte-virtdev" onclick="ouvrirSlide('virtdev')">
            <h3>🏆 Concours Virt_Dev</h3>
            <p>La première édition du concours de développement web de VirtTech. Découvrez le déroulement, les gagnants et l'analyse du jury.</p>
            <div class="indice">Cliquez pour lire l'histoire ➔</div>
        </div>

    </div>
</div>

<!-- LE SLIDE -->
<div class="slide-overlay" id="slide-overlay" onclick="fermerSlide()"></div>
<div class="slide-panel" id="slide-panel">
    <div class="slide-header">
        <h3 id="slide-title">Chargement...</h3>
        <button class="btn-fermer-slide" onclick="fermerSlide()">✕</button>
    </div>
    <div class="slide-contenu" id="slide-contenu">
        <!-- Le contenu sera injecté par le JS -->
    </div>
</div>

<script src="header.js"></script>

<script>
// GESTION DU SLIDE
const activites = {
    'virtdev': {
        titre: "🏆 Concours Virt_Dev",
        contenu: `
            <h4>📅 Déroulement</h4>
            <p>Du 30 octobre au 4 novembre 2026. Les participants devaient reproduire une maquette de page de connexion (Login Page) en HTML et CSS. L'utilisation de l'IA était autorisée.</p>
            
            <h4>🥇 Les Gagnants</h4>
            <div class="badge-gagnant">1ère Place : Horo David (2 000 F CFA)</div><br>
            <div class="badge-gagnant" style="background:var(--surface); color:var(--ombre);">2ème Place : Koudouss (1 000 F CFA)</div>
            <p style="margin-top:10px; font-size:0.85rem;">Les paiements ont été effectués par Mobile Money (Wave) en direct sur le groupe WhatsApp.</p>

            <h4>⚖️ Décision du Jury</h4>
            <p>Le jury a départagé les deux candidats sur la base de plusieurs critères :</p>
            <ul>
                <li>L'intégration du logo via la technique du <strong>Base64</strong> (Horo).</li>
                <li>L'ajout d'<strong>animations 3D</strong> et d'effets de survol très fluides (Horo).</li>
                <li>La propreté générale du code (Les deux candidats).</li>
            </ul>

            <h4>💰 Bilan Financier</h4>
            <p>Frais d'inscription : 1 000 F CFA (2 x 500 F).<br>
            Prix distribués : 3 000 F CFA (complétés par le fondateur).</p>

            <a href="resultats.html" class="lien-resultats">Voir la page des résultats complète ➔</a>
        `
    }
};

function ouvrirSlide(id) {
    const data = activites[id];
    if (!data) return;

    document.getElementById('slide-title').innerText = data.titre;
    document.getElementById('slide-contenu').innerHTML = data.contenu;

    document.getElementById('slide-overlay').classList.add('ouvert');
    document.getElementById('slide-panel').classList.add('ouvert');
    document.body.style.overflow = 'hidden';
}

function fermerSlide() {
    document.getElementById('slide-overlay').classList.remove('ouvert');
    document.getElementById('slide-panel').classList.remove('ouvert');
    document.body.style.overflow = '';
}

// ANIMATIONS AU DEFILEMENT (Intersection Observer)
document.addEventListener("DOMContentLoaded", function() {
    var els = document.querySelectorAll('.reveal');
    if('IntersectionObserver' in window){
        var io = new IntersectionObserver(function(es){
            es.forEach(function(e){
                if(e.isIntersecting){
                    e.target.classList.add('vu');
                    io.unobserve(e.target);
                }
            });
        }, {threshold: .12});
        els.forEach(function(e){io.observe(e)});
    } else {
        els.forEach(function(e){e.classList.add('vu')});
    }
});
</script>

</body>
</html>
