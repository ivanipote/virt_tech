<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page de Connexion VirtTech</title>
<!-- police Roboto -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bleu-nuit: #0B2542;
    --dore: #D4AF37;
    --gris-bordure: #DFE3E6;
    --gris-texte: #888;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 0;
    display: flex;
    background: linear-gradient(180deg, #0F2D53, #0A2341);
    font-family: 'Roboto', sans-serif;
  }

  /* le téléphone */
  .smartphone {
    position: relative;
    flex: none;
    width: 275px;
    height: 570px;
    margin: auto;
    border: 9px solid #000;
    border-radius: 45px;
    background: #000;
    box-shadow: 0 0 0 1px #555, 0 24px 48px rgba(0, 0, 0, 0.4);
    /* petite inclinaison */
    transform: perspective(800px) rotateY(-4deg) rotateX(3.5deg);
  }

  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 108px;
    height: 28px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 10;
  }

  /* l'écran */
  .screen {
    width: 100%;
    height: 100%;
    padding-top: 78px;
    border-radius: 36px;
    overflow: hidden;
    text-align: center;
    background: linear-gradient(180deg, #FDFEFE, #F1F5F8);
  }

  .logo {
    display: block;
    width: 108px;
    margin: 0 auto 18px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  }

  .title {
    margin: 0 0 24px;
    font-size: 22px;
    line-height: 26px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--bleu-nuit);
  }

  /* le formulaire */
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 84%;
    margin: 0 auto;
  }

  input {
    width: 100%;
    height: 50px;
    padding: 0 15px;
    border: 1px solid var(--gris-bordure);
    border-radius: 10px;
    background: #fff;
    font-family: inherit;
    font-size: 16px;
    transition: all 0.3s ease;
  }

  input::placeholder {
    color: #757575;
    opacity: 1;
  }

  /* bordure dorée quand on clique dans un champ */
  input:focus {
    outline: none;
    border-color: var(--dore);
    box-shadow: 0 0 0 1px var(--dore);
  }

  .login-btn {
    height: 46px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: var(--bleu-nuit);
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(11, 37, 66, 0.25);
    transition: all 0.3s ease;
  }

  /* le bouton devient doré au survol */
  .login-btn:hover {
    background: var(--dore);
    color: var(--bleu-nuit);
    box-shadow: 0 8px 18px -4px rgba(212, 175, 55, 0.55);
  }

  .login-btn:active {
    transform: translateY(1px);
  }

  .forgot-link {
    display: block;
    margin-top: 19px;
    font-size: 14px;
    line-height: 16px;
    color: var(--gris-texte);
    text-decoration: none;
    transition: color 0.3s;
  }

  .forgot-link:hover {
    color: #555;
    text-decoration: underline;
  }
</style>
</head>
