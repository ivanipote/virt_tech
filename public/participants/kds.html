<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virt Tech - Connexion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#0A2342;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.iphone{width:320px;height:680px;background:#fff;border:10px solid #000;border-radius:52px;position:relative;overflow:hidden}
.notch{width:130px;height:28px;background:#000;border-radius:0 0 14px 14px;position:absolute;top:0;left:50%;transform:translateX(-50%)}
.screen{padding:55px 24px 20px;display:flex;flex-direction:column;align-items:center;height:100%}
.logo{width:210px;height:150px;display:flex;justify-content:center;align-items:center}
.logo img{width:100%;height:100%;object-fit:contain}
h1{font-size:28px;font-weight:900;color:#0A1931;margin:15px 0 25px}
input{width:100%;padding:17px 18px;border:1.5px solid #D1D5DB;border-radius:12px;margin-bottom:16px;background:#F9FAFB;outline:none;font-size:16px}
.btn{width:100%;padding:18px;background:#0A1931;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:17px;margin-top:8px}
.oublie{margin-top:20px;color:#6B7280;font-size:14px}
</style>
</head>
<body>
<div class="iphone">
  <div class="notch"></div>
  <div class="screen">
    <div class="logo"><img src="/public/logo.png" alt="Virt Tech"></div>
    <h1>CONNEXION</h1>
    <input placeholder="Adresse Email">
    <input type="password" placeholder="Mot de passe">
    <button class="btn">Se connecter</button>
    <p class="oublie">Mot de passe oublié ?</p>
  </div>
</div>
</body>
</html>
