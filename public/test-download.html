<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Téléchargement - VirtTech</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: #161F27; color: #CED3D6; }
        .box { background: #2d2d2d; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; }
        h2 { color: #D4AF37; margin-bottom: 20px; }
        .warning { color: #ffb3b3; font-size: 0.85rem; margin-bottom: 20px; border: 1px solid #ff4d4d; padding: 10px; border-radius: 8px; background: rgba(255, 0, 0, 0.1); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; background: #1e1e1e; color: white; outline: none; }
        input:focus { border-color: #D4AF37; }
        button { width: 100%; padding: 15px; border-radius: 8px; border: none; background: #D4AF37; color: #161F27; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #F4D03F; transform: scale(1.02); }
        #resultat { margin-top: 20px; font-weight: bold; font-size: 0.95rem; }
        a { color: #D4AF37; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Télécharger une vidéo</h2>
        <div class="warning">
            ⚠️ Outil de test réservé aux vidéos dont vous avez les droits (vos propres vidéos).
        </div>
        <input type="text" id="url" placeholder="Lien YouTube (ex: https://youtu.be/...)">
        <input type="text" id="nom" placeholder="Nom du fichier (ex: ma-video)">
        <button onclick="telecharger()">Télécharger</button>
        <div id="resultat"></div>
    </div>

    <script>
        async function telecharger() {
            const url = document.getElementById('url').value;
            const nom = document.getElementById('nom').value;
            const resultat = document.getElementById('resultat');
            
            if (!url || !nom) {
                resultat.innerText = "Veuillez remplir tous les champs.";
                resultat.style.color = "red";
                return;
            }

            resultat.innerText = "Téléchargement en cours... (cela peut prendre 1 à 2 minutes)";
            resultat.style.color = "orange";

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, nom })
                });
                const data = await response.json();

                if (data.succes) {
                    resultat.innerHTML = `✅ Téléchargé ! <a href="${data.lien}" target="_blank">Cliquez ici pour voir la vidéo</a>`;
                    resultat.style.color = "#00FF9D";
                } else {
                    resultat.innerText = "❌ " + data.message;
                    resultat.style.color = "red";
                }
            } catch (error) {
                resultat.innerText = "❌ Erreur de connexion au serveur.";
                resultat.style.color = "red";
            }
        }
    </script>
</body>
</html>
