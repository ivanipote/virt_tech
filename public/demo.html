<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raccourcisseur de Liens - VirtTech</title>

<!-- SEO -->
<meta name="description" content="Créez des liens courts et personnalisés avec VirtTech. Partagez facilement vos liens GitHub ou autres." />

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/header.css">
<style>
    /* Styles spécifiques à cette page */
    body {
        background: var(--fond);
        min-height: 100vh;
    }

    .shortener-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        background: var(--blanc);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(22,31,39,0.1);
        border-top: 6px solid var(--or);
    }

    .shortener-container h1 {
        text-align: center;
        color: var(--ombre);
        margin-bottom: 10px;
        font-size: 1.8rem;
    }

    .shortener-container p.subtitle {
        text-align: center;
        color: var(--metal-moyen);
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--metal-fonce);
    }

    .form-group input {
        width: 100%;
        padding: 15px;
        border: 2px solid var(--surface);
        border-radius: 12px;
        font-size: 1rem;
        background: #fdfdfd;
        outline: none;
        transition: 0.3s;
        box-sizing: border-box;
    }

    .form-group input:focus {
        border-color: var(--metal-fonce);
        box-shadow: 0 0 0 4px rgba(96, 106, 115, 0.1);
    }

    .btn-submit {
        width: 100%;
        padding: 15px;
        background: var(--metal-fonce);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    .btn-submit:hover {
        background: var(--ombre);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .btn-submit:disabled {
        background: var(--metal-moyen);
        cursor: not-allowed;
        transform: none;
    }

    /* Zone de résultat */
    .resultat-box {
        margin-top: 25px;
        padding: 20px;
        background: var(--surface);
        border-radius: 12px;
        text-align: center;
        display: none; /* Caché par défaut */
        border-left: 5px solid var(--or);
    }

    .resultat-box.visible {
        display: block;
    }

    .lien-court {
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--metal-fonce);
        word-break: break-all;
        margin: 10px 0;
        display: block;
    }

    .btn-copier {
        background: var(--blanc);
        color: var(--metal-fonce);
        border: 1px solid var(--metal);
        padding: 8px 15px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
        margin-top: 10px;
    }

    .btn-copier:hover {
        background: var(--metal-fonce);
        color: white;
    }

    .error-msg {
        color: #ff4d4d;
        font-weight: bold;
        margin-top: 15px;
        text-align: center;
    }
</style>
</head>
<body>

<!-- Le header s'injecte ici via header.js -->
<script src="/js/header.js"></script>

<div class="shortener-container">
    <h1>Raccourcisseur de Liens</h1>
    <p class="subtitle">Transformez vos longs liens GitHub en liens courts et personnalisés.</p>

    <div class="form-group">
        <label for="urlOriginale">Lien long (URL)</label>
        <input type="url" id="urlOriginale" placeholder="https://github.com/votre-profil/mon-projet">
    </div>

    <div class="form-group">
        <label for="codePersonnalise">Mot-clé personnalisé (Optionnel)</label>
        <input type="text" id="codePersonnalise" placeholder="mon-projet (laissez vide pour un code aléatoire)">
    </div>

    <button class="btn-submit" id="btnRaccourcir">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
        Raccourcir le lien
    </button>

    <div class="resultat-box" id="resultatBox">
        <p>Votre lien court est prêt :</p>
        <span class="lien-court" id="lienCourt"></span>
        <button class="btn-copier" id="btnCopier">📋 Copier</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
</div>

<script>
document.getElementById('btnRaccourcir').addEventListener('click', async function() {
    const url = document.getElementById('urlOriginale').value;
    const code = document.getElementById('codePersonnalise').value;
    const btn = this;
    const resultatBox = document.getElementById('resultatBox');
    const lienCourt = document.getElementById('lienCourt');
    const errorMsg = document.getElementById('errorMsg');

    // Réinitialisation
    resultatBox.classList.remove('visible');
    errorMsg.innerText = "";
    lienCourt.innerText = "";

    if (!url) {
        errorMsg.innerText = "Veuillez entrer un lien long.";
        return;
    }

    // État de chargement
    btn.disabled = true;
    btn.innerHTML = "Création en cours...";

    try {
        const response = await fetch('/api/shorten', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url, code: code })
        });

        const data = await response.json();

        if (data.succes) {
            lienCourt.innerText = data.short_url;
            resultatBox.classList.add('visible');
        } else {
            errorMsg.innerText = data.message;
        }
    } catch (error) {
        errorMsg.innerText = "Erreur de connexion au serveur.";
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg> Raccourcir le lien`;
    }
});

// Bouton Copier
document.getElementById('btnCopier').addEventListener('click', function() {
    const lien = document.getElementById('lienCourt').innerText;
    if (lien) {
        navigator.clipboard.writeText(lien).then(() => {
            this.innerText = "✅ Copié !";
            setTimeout(() => { this.innerText = "📋 Copier"; }, 2000);
        });
    }
});
</script>

</body>
</html>
