<title>Astuces VirtTech</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concept : identité VirtTech conservée (métal bleu-gris + or, coins très arrondis, code sombre sur cartes claires).
   Nouveautés : recherche/filtres serveur, astuce du jour, niveaux, détail, édition, chargement progressif. */
:root{
  /* Valeurs estimées d'après header.css : à remplacer par le :root réel de /css/style.css */
  --fond:#E8EDEF;
  --surface:#D9E0E2;
  --blanc:#F8FAFB;
  --metal:#7E909B;
  --metal-fonce:#2F3C47;
  --ombre:#161F27;
  --or:#D4AF37;
  --logo-fond:#FFFFFF;
  /* Dérivés de cette page */
  --bord:#D3DBDF;
  --texte-doux:#5B6B76;
  --erreur:#B3402F;
  --ok:#2F7D4F;
  --code-fond:#282a36;
  --code-entete:#1e1e1e;
  --rayon:23px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{
  background:var(--fond);color:var(--ombre);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:16px;
  margin:0;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--fond)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.125em}

/* ===== Header commun (copie de header.css) ===== */
.brand{font-weight:900;letter-spacing:3px;font-size:1.2rem;color:var(--surface);text-decoration:none}
.brand span{color:var(--metal)}
.top{position:sticky;top:calc(5px + env(safe-area-inset-top,0px));z-index:70;margin:5px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:linear-gradient(135deg,var(--metal-fonce),var(--ombre));color:var(--surface);border:2px solid var(--metal);border-radius:23px;box-shadow:0 10px 28px rgba(22,31,39,.4)}
.burger{display:flex;align-items:center;gap:12px;background:rgba(217,224,226,.08);border:1px solid var(--metal);color:var(--surface);border-radius:16px;padding:9px 16px;font-weight:700;font-size:.95rem;cursor:pointer;transition:.2s}
.burger:hover{background:var(--surface);color:var(--ombre)}
.burger i{display:block;width:18px;height:2px;background:currentColor;box-shadow:0 6px 0 currentColor,0 -6px 0 currentColor}
.voile{position:fixed;inset:0;z-index:90;background:rgba(22,31,39,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.voile.ouvert{opacity:1;pointer-events:auto}
.side{position:fixed;top:calc(5px + env(safe-area-inset-top,0px));left:calc(5px + env(safe-area-inset-left,0px));bottom:calc(5px + env(safe-area-inset-bottom,0px));width:280px;max-width:calc(100% - 10px);z-index:100;display:flex;flex-direction:column;padding:22px 18px;background:linear-gradient(180deg,#2A3540 0%,#161F27 100%);color:var(--blanc);border:1px solid rgba(212,175,55,.3);border-radius:23px;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);transform:translateX(calc(-100% - 20px));visibility:hidden;transition:transform .35s cubic-bezier(.22,.8,.3,1),visibility 0s .35s;overflow-y:auto}
.side.ouvert{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.22,.8,.3,1)}
.side-tete{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.side-id{display:flex;align-items:center;gap:12px}
.mini{flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden;border:2px solid var(--metal);background:var(--logo-fond);display:grid;place-items:center}
.logo-vt{width:100%;height:100%;display:block}
.fermer{flex:none;width:38px;height:38px;border-radius:50%;background:none;border:1px solid var(--metal);color:var(--surface);font-size:1.1rem;cursor:pointer;transition:.2s;display:flex;justify-content:center;align-items:center}
.fermer:hover{background:var(--surface);color:var(--ombre)}
.side nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.side nav ul li{opacity:0;transform:translateX(-20px);transition:opacity .4s ease,transform .4s ease}
.side.ouvert nav ul li{opacity:1;transform:none}
.side.ouvert nav ul li:nth-child(1){transition-delay:.1s}.side.ouvert nav ul li:nth-child(2){transition-delay:.15s}.side.ouvert nav ul li:nth-child(3){transition-delay:.2s}.side.ouvert nav ul li:nth-child(4){transition-delay:.25s}.side.ouvert nav ul li:nth-child(5){transition-delay:.3s}.side.ouvert nav ul li:nth-child(6){transition-delay:.35s}.side.ouvert nav ul li:nth-child(7){transition-delay:.4s}.side.ouvert nav ul li:nth-child(8){transition-delay:.45s}.side.ouvert nav ul li:nth-child(9){transition-delay:.5s}
.side nav li a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;color:#B0BEC5;text-decoration:none;border-radius:16px;border:1px solid transparent;font-weight:600;font-size:.92rem;transition:all .3s cubic-bezier(.25,.8,.25,1)}
.side nav li a span{white-space:nowrap}
.side nav li a .ic{font-size:1.1rem;color:var(--metal);width:20px;transition:all .3s ease}
.side nav li a:hover{background:rgba(255,255,255,.05);color:var(--blanc);border-color:rgba(212,175,55,.3);transform:translateX(5px);box-shadow:0 4px 15px rgba(0,0,0,.2)}
.side nav li a:hover .ic{color:var(--or);transform:scale(1.2) rotate(-5deg)}
.side nav li a.actif{background:linear-gradient(90deg,rgba(212,175,55,.2),transparent);color:var(--or);border-left:4px solid var(--or)}
.side nav li a.actif .ic{color:var(--or)}
.side-footer{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:12px}
.btn-side-contact{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,var(--metal-fonce),#1a2530);color:var(--blanc);border:1px solid var(--or);border-radius:16px;padding:14px;text-decoration:none;font-weight:bold;font-size:.9rem;transition:all .3s ease}
.btn-side-contact .ic{color:var(--or)}
.btn-side-contact:hover{background:var(--or);color:var(--ombre);transform:translateY(-3px)}
.btn-side-contact:hover .ic{color:var(--ombre)}
.side small{text-align:center;font-size:.75rem;color:var(--metal);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:6px 10px;background:rgba(0,0,0,.2)}

/* ===== Page ===== */
.page-container{max-width:1040px;margin:0 auto;padding:18px 0 120px}
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 18px;padding:9px 14px;border:1px dashed var(--metal);border-radius:14px;font-size:.82rem;color:var(--texte-doux);background:rgba(248,250,251,.6)}
.demo-bar strong{color:var(--metal-fonce)}
.demo-bar button{background:none;border:1px solid var(--metal);border-radius:10px;padding:4px 10px;cursor:pointer;color:var(--metal-fonce);font-size:.8rem}
.demo-bar button:hover{background:var(--metal-fonce);color:#fff}
.page-header{text-align:center;margin-bottom:22px}
.page-header h1{margin:6px 0 6px;font-size:2rem;color:var(--ombre);text-wrap:balance}
.stats{margin:0 0 16px;color:var(--texte-doux);font-size:.95rem;min-height:1.4em}
.stats b{color:var(--metal-fonce);font-variant-numeric:tabular-nums}

/* Astuce du jour */
.du-jour{display:grid;grid-template-columns:auto 1fr auto;gap:8px 18px;align-items:center;margin:0 0 24px;padding:18px 22px;border-radius:var(--rayon);background:linear-gradient(135deg,var(--metal-fonce),var(--ombre));color:var(--surface);border:1px solid rgba(212,175,55,.45);box-shadow:0 10px 28px rgba(22,31,39,.25);text-align:left;width:100%;cursor:pointer;transition:transform .25s,box-shadow .25s}
.du-jour:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(22,31,39,.32)}
.dj-icone{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;color:var(--or);border:1px solid rgba(212,175,55,.5);background:rgba(212,175,55,.1)}
.dj-texte{min-width:0}
.dj-label{font-size:.78rem;letter-spacing:.04em;color:var(--or);font-weight:700}
.dj-titre,.dj-label,.dj-meta{display:block}
.dj-titre{margin:2px 0 0;font-size:1.15rem;font-weight:700;color:#fff;overflow-wrap:anywhere}
.dj-meta{margin:2px 0 0;font-size:.85rem;color:#B0BEC5}
.dj-cta{font-weight:700;color:var(--or);font-size:.9rem;white-space:nowrap}

/* Onglets + barre d'outils */
.tabs-container{display:flex;justify-content:center;gap:6px;background:var(--blanc);padding:5px;border-radius:50px;width:fit-content;max-width:100%;margin:0 auto 18px;box-shadow:0 5px 15px rgba(0,0,0,.05)}
.tab-btn{padding:10px 22px;border:none;background:transparent;border-radius:50px;font-weight:700;font-size:.98rem;color:var(--metal);cursor:pointer;transition:.3s}
.tab-btn:hover{color:var(--metal-fonce)}
.tab-btn.actif{background:var(--metal-fonce);color:#fff}
.outils{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.champ-recherche{position:relative}
.champ-recherche .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--metal);pointer-events:none}
.outils input,.outils select{width:100%;height:46px;border-radius:14px;border:1px solid var(--bord);background:var(--blanc);padding:0 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.champ-recherche input{padding-left:42px}
.outils input:focus,.outils select:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(212,175,55,.2)}
.sous-outils{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:34px;margin-bottom:6px;font-size:.9rem;color:var(--texte-doux)}
.btn-reset{background:none;border:none;color:var(--metal-fonce);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px 6px}
.btn-reset:hover{color:var(--ombre)}

/* Grille + cartes */
.grille-astuces{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:22px;margin-top:10px;align-items:start}
.card-astuce{background:var(--blanc);border-radius:18px;box-shadow:0 8px 25px rgba(0,0,0,.07);display:flex;flex-direction:column;border:1px solid var(--bord);transition:transform .3s,box-shadow .3s;cursor:pointer;min-width:0;overflow:hidden}
.card-astuce:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.12)}
.card-header{padding:18px 20px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-header h3{margin:0;color:var(--ombre);font-size:1.15rem;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.tag-langage{background:var(--metal-fonce);color:#fff;font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:15px;text-transform:uppercase;flex-shrink:0}
.niveau{display:flex;align-items:center;gap:8px;padding:0 20px 8px;font-size:.8rem;color:var(--texte-doux)}
.niveau-barres{display:inline-flex;gap:3px;align-items:flex-end}
.niveau-barres i{display:block;width:5px;border-radius:2px;background:var(--bord)}
.niveau-barres i:nth-child(1){height:7px}.niveau-barres i:nth-child(2){height:11px}.niveau-barres i:nth-child(3){height:15px}
.niveau-barres i.on{background:var(--or)}
.card-content{padding:0 20px 14px;color:var(--metal-fonce);font-size:.95rem;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
.card-astuce:not(.detail) .card-content{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.code-wrapper{margin:0 20px 18px;border-radius:10px;overflow:hidden;background:var(--code-fond);border:1px solid #444;position:relative;min-width:0}
.code-header{background:var(--code-entete);padding:7px 12px 7px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #444}
.code-lang{color:#9aa0b2;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
.btn-copy{background:transparent;color:#ccc;border:1px solid #555;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:6px}
.btn-copy:hover{background:#444;color:#fff}
.btn-copy.ok{color:#8be9a8;border-color:#8be9a8}
.code-content{padding:14px 15px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.55;color:#f8f8f2}
.code-content.coupe{max-height:11.5em;overflow-y:hidden}
.code-wrapper.coupe-wrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42px;background:linear-gradient(transparent,var(--code-fond));pointer-events:none}
.card-astuce.detail .code-content.coupe{max-height:none}
.code-content pre,.code-content code{margin:0;padding:0;background:transparent;font:inherit;text-shadow:none;white-space:pre;color:inherit}
.token.comment,.token.prolog,.token.doctype,.token.cdata{color:#7b88b8}
.token.punctuation{color:#f8f8f2}
.token.property,.token.tag,.token.constant,.token.symbol,.token.deleted{color:#ff79c6}
.token.boolean,.token.number{color:#bd93f9}
.token.selector,.token.attr-name,.token.string,.token.char,.token.builtin,.token.inserted{color:#50fa7b}
.token.operator,.token.entity,.token.url,.token.variable{color:#f8f8f2}
.token.atrule,.token.attr-value,.token.function,.token.class-name{color:#f1fa8c}
.token.keyword{color:#8be9fd}
.token.regex,.token.important{color:#ffb86c}
.card-footer{padding:13px 20px;background:#EFF3F5;border-top:1px solid var(--bord);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.social-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.social-btn{background:none;border:none;display:flex;align-items:center;gap:6px;color:var(--metal);font-size:.9rem;cursor:pointer;transition:.2s;padding:6px;border-radius:8px;font-variant-numeric:tabular-nums}
.social-btn:hover{color:var(--or)}
.social-btn.statique{cursor:default}
.social-btn.statique:hover{color:var(--metal)}
.social-btn.liked{color:var(--erreur)}
.social-btn.liked .ic{fill:currentColor}
.social-btn.danger:hover{color:var(--erreur)}
.author-info{font-size:.8rem;color:var(--metal);text-align:right;display:flex;flex-direction:column;min-width:0}
.author-info strong{color:var(--metal-fonce);font-size:.9rem;overflow-wrap:anywhere}
.time-post{font-size:.72rem;color:#7a8791;margin-top:2px}
.badge-moi{display:inline-block;font-size:.68rem;font-weight:700;color:var(--metal-fonce);border:1px solid var(--or);border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:1px}

/* États */
#loader{display:flex;justify-content:center;align-items:center;padding:50px 0;width:100%}
.loader-virttech{width:80px;height:80px;position:relative}
.loader-virttech::before,.loader-virttech::after{content:"";position:absolute;border-radius:50%;border:3px solid transparent}
.loader-virttech::before{inset:0;border-top-color:var(--metal);border-right-color:var(--metal);animation:spin-horaire 1.2s linear infinite}
.loader-virttech::after{inset:10px;border-bottom-color:var(--metal-fonce);border-left-color:var(--metal-fonce);animation:spin-anti-horaire 1.5s linear infinite}
.loader-virttech .logo-vt{position:absolute;top:50%;left:50%;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;z-index:2}
@keyframes spin-horaire{to{transform:rotate(360deg)}}
@keyframes spin-anti-horaire{to{transform:rotate(-360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.plus{display:flex;justify-content:center;padding:24px 0}
.spinner{border:3px solid #d3dbdf;border-top-color:var(--metal-fonce);border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite}
.btn-plus{background:var(--blanc);border:1px solid var(--metal);border-radius:14px;padding:11px 22px;font-weight:700;color:var(--metal-fonce);cursor:pointer}
.btn-plus:hover{background:var(--metal-fonce);color:#fff}
.fin-liste{text-align:center;color:var(--texte-doux);font-size:.88rem;padding:18px 0}
.etat-vide{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--metal-fonce)}
.etat-vide .ic{font-size:3rem;color:var(--metal);margin-bottom:16px;display:block;margin-inline:auto}
.etat-vide h3{margin:0 0 8px;color:var(--ombre);font-size:1.3rem}
.etat-vide p{margin:0 auto 20px;max-width:46ch}
.btn-principal{display:inline-flex;align-items:center;gap:8px;background:var(--metal-fonce);color:#fff;border:2px solid var(--or);border-radius:14px;padding:11px 20px;font-weight:700;cursor:pointer;transition:.25s}
.btn-principal:hover{background:var(--or);color:var(--ombre)}

/* Bouton flottant */
.btn-add-astuce{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));right:calc(26px + env(safe-area-inset-right,0px));z-index:900;width:60px;height:60px;border-radius:50%;background:var(--metal-fonce);color:#fff;display:flex;justify-content:center;align-items:center;font-size:1.5rem;border:2px solid var(--or);cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,background-color .25s ease;box-shadow:0 5px 15px rgba(0,0,0,.25)}
.btn-add-astuce:hover{background:var(--or);color:var(--ombre);transform:scale(1.1);box-shadow:0 8px 25px rgba(0,0,0,.3)}

/* Panneau formulaire */
.slide-overlay{position:fixed;inset:0;background:rgba(22,31,39,.8);backdrop-filter:blur(3px);z-index:1000;opacity:0;visibility:hidden;transition:.3s}
.slide-overlay.ouvert{opacity:1;visibility:visible}
.slide-panel{position:fixed;bottom:0;left:50%;width:min(100%,860px);height:92vh;height:92dvh;background:var(--surface);border-radius:25px 25px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);z-index:1001;transform:translate(-50%,100%);visibility:hidden;transition:transform .4s cubic-bezier(.22,.8,.3,1),visibility 0s .4s;display:flex;flex-direction:column}
.slide-panel.ouvert{transform:translate(-50%,0);visibility:visible;transition:transform .4s cubic-bezier(.22,.8,.3,1)}
.slide-inner{width:100%;display:flex;flex-direction:column;min-height:0;flex:1}
.slide-header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px));background:var(--metal-fonce);color:#fff;border-radius:25px 25px 0 0}
.slide-header h3{margin:0;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.header-actions{display:flex;gap:8px;align-items:center}
.btn-header{background:none;border:none;color:#fff;font-size:1.15rem;cursor:pointer;padding:8px 10px;transition:.2s;border-radius:10px;display:flex;align-items:center;gap:8px}
.btn-header:hover{background:rgba(255,255,255,.12)}
.btn-header.btn-run{color:var(--ombre);background:var(--or);font-weight:700;font-size:.95rem;padding:8px 16px}
.btn-header.btn-run:hover{background:#e3c25a}
.btn-header[disabled]{opacity:.6;cursor:wait}
.slide-body{flex:1;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full-width{grid-column:1/-1}
.form-group{min-width:0}
.form-group label{display:flex;justify-content:space-between;margin-bottom:7px;font-weight:700;color:var(--metal-fonce);font-size:.92rem}
.form-group label small{font-weight:400;color:var(--texte-doux);font-variant-numeric:tabular-nums}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;border-radius:10px;border:2px solid #bcc7cd;background:var(--blanc);outline:none;transition:.25s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--or)}
.form-group.invalide input,.form-group.invalide textarea{border-color:var(--erreur)}
.msg-erreur{color:var(--erreur);font-size:.84rem;margin-top:6px;min-height:1em}
.editeur-code{display:block;width:100%;min-height:190px;resize:vertical;border:2px solid #444!important;border-radius:10px!important;background:var(--code-fond)!important;color:#f8f8f2!important;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem!important;line-height:1.55;tab-size:2;white-space:pre}
.niveau-choix{display:flex;gap:8px;flex-wrap:wrap}
.niveau-choix input{position:absolute;opacity:0;pointer-events:none}
.niveau-choix label{margin:0;padding:10px 14px;border:2px solid #bcc7cd;border-radius:12px;cursor:pointer;background:var(--blanc);display:flex;align-items:center;gap:8px;font-weight:600;transition:.2s}
.niveau-choix input:checked+label{border-color:var(--or);background:#fff8de}
.niveau-choix input:focus-visible+label{outline:2px solid var(--or);outline-offset:2px}

/* Overlay de confirmation et détail */
.overlay-bg{position:fixed;inset:0;background:rgba(22,31,39,.7);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:center;z-index:2000;opacity:0;visibility:hidden;transition:.3s;padding:16px}
.overlay-bg.ouvert{opacity:1;visibility:visible}
.overlay-box{background:var(--surface);padding:28px;border-radius:18px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:scale(.92);transition:.3s;border:2px solid var(--metal)}
.overlay-bg.ouvert .overlay-box{transform:none}
.overlay-box h3{color:var(--ombre);margin:0 0 10px;font-size:1.25rem}
.overlay-box p{color:var(--metal-fonce);margin:0 0 24px;line-height:1.5}
.overlay-actions{display:flex;gap:12px}
.btn-ov{padding:12px 20px;border-radius:10px;border:none;font-weight:700;cursor:pointer;transition:.2s;flex:1}
.btn-ov-annuler{background:var(--metal);color:#fff}
.btn-ov-annuler:hover{background:var(--metal-fonce)}
.btn-ov-confirmer{background:var(--ombre);color:#fff;border:1px solid var(--metal)}
.btn-ov-confirmer:hover{background:var(--metal-fonce)}
.btn-ov-danger{background:var(--erreur);color:#fff}
.btn-ov-danger:hover{background:#8f3123}
.detail-bg{align-items:flex-start;overflow-y:auto;z-index:1500}
.detail-box{width:100%;max-width:720px;margin:max(16px,env(safe-area-inset-top,0px)) auto 40px;position:relative}
.detail-fermer{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--metal);background:var(--blanc);cursor:pointer;display:grid;place-items:center;font-size:1.05rem}
.detail-fermer:hover{background:var(--metal-fonce);color:#fff}
.detail-box .card-astuce{cursor:default;transform:none!important}
.detail-box .card-header{padding-right:58px}

/* Toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ombre);color:#fff;padding:12px 18px;border-radius:14px;border:1px solid var(--metal);box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:.92rem;display:flex;align-items:center;gap:10px;animation:toast-in .3s ease}
.toast.erreur{border-color:var(--erreur)}
.toast.erreur .ic{color:#ff9d8f}
.toast .ic{color:var(--or)}
@keyframes toast-in{from{opacity:0;transform:translateY(10px)}}

@media (max-width:820px){.outils{grid-template-columns:1fr 1fr}.champ-recherche{grid-column:1/-1}}
@media (max-width:600px){
  .form-grid{grid-template-columns:1fr}
  .du-jour{grid-template-columns:auto 1fr}.dj-cta{grid-column:1/-1}
  .tab-btn{padding:10px 14px;font-size:.92rem}

  .outils{grid-template-columns:1fr 1fr}.outils #fLangage{grid-column:1/-1}
  .btn-header.btn-run span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      {id:4,auteur:'Megane',titre:'Limiter les requêtes par IP sans librairie',contenu:'Une Map en mémoire, une fenêtre de temps et un compteur par IP. Derrière un proxy, active trust proxy pour que req.ip soit la vraie adresse.',langage:'Node.js',niveau:'Avancé',code:'function limiter({ fenetreMs, max }) {\n  const compteurs = new Map();\n  return (req, res, next) => {\n    const now = Date.now();\n    let e = compteurs.get(req.ip);\n    if (!e || e.fin <= now) {\n      e = { n: 0, fin: now + fenetreMs };\n      compteurs.set(req.ip, e);\n    }\n    if (++e.n > max) return res.status(429).end();\n    next();\n  };\n}',likes:18,vues:121,date_creation:il(2*j),date_modification:null,owner:MOI},

      {id:6,auteur:'Ivan',titre:'Un hook useDebounce pour la recherche',contenu:'Évite d\'appeler l\'API à chaque frappe. La valeur ne change qu\'après un court silence de l\'utilisateur.',langage:'React',niveau:'Intermédiaire',code:'function useDebounce(valeur, delai = 300) {\n  const [v, setV] = useState(valeur);\n  useEffect(() => {\n    const t = setTimeout(() => setV(valeur), delai);\n    return () => clearTimeout(t);\n  }, [valeur, delai]);\n  return v;\n}',likes:31,vues:205,date_creation:il(4*j),date_modification:null,owner:'o5'},

      {id:9,auteur:'Koffi',titre:'Typer la réponse d\'une API',contenu:'Une interface pour la forme des données, un générique pour la fonction de lecture. Le compilateur te prévient quand l\'API change.',langage:'TypeScript',niveau:'Intermédiaire',code:'interface Reponse<T> {\n  succes: boolean;\n  data: T;\n}\n\nasync function lire<T>(url: string): Promise<T> {\n  const r = await fetch(url);\n  const json: Reponse<T> = await r.json();\n  return json.data;\n}',likes:25,vues:172,date_creation:il(8*j),date_modification:null,owner:'o2'},

      {id:13,auteur:'Fatou',titre:'Arrêter proprement un serveur Node',contenu:'À la réception de SIGTERM, on arrête d\'accepter des connexions et on ferme le pool de base de données avant de quitter.',langage:'Node.js',niveau:'Avancé',code:'process.on("SIGTERM", () => {\n  server.close(async () => {\n    await pool.end();\n    process.exit(0);\n  });\n});',likes:11,vues:79,date_creation:il(18*j),date_modification:null,owner:'o4'},
      {id:14,auteur:'Awa',titre:'Revenir à la branche précédente dans Git',contenu:'git switch - te ramène à la dernière branche utilisée, comme la touche retour d\'un navigateur.',langage:'Autre',niveau:'Débutant',code:'git switch -',likes:9,vues:64,date_creation:il(25*j),date_modification:null,owner:'o6'}

      const tri=q.get('tri');

      const total=l.length; const data=l.slice((page-1)*lim,page*lim).map(a=>publique(a,tok));

      if(!base.length) return reponse(200,{succes:true,data:null});
      const a=base.slice().sort((x,y)=>hashJour(x.id)-hashJour(y.id))[0];
      return reponse(200,{succes:true,data:publique(a,tok)});
    }
    const m=chemin.match(/^\/(\d+)(?:\/(like|unlike|vue))?$/);
    if(methode==='POST'&&chemin==='/'){
      if(!tokOk) return err(400,'Jeton visiteur invalide.');
      const v=valider(corps); if(typeof v==='string') return err(400,v);
      const a=Object.assign({id:nextId++,likes:0,vues:0,date_creation:new Date().toISOString(),date_modification:null,owner:tok},v);
      base.unshift(a); return reponse(201,{succes:true,data:publique(a,tok)});
    }
    if(m){
      const id=parseInt(m[1],10); const a=base.find(x=>x.id===id); const act=m[2];
      if(methode==='GET'&&!act){ return a?reponse(200,{succes:true,data:publique(a,tok)}):err(404,'Astuce introuvable.') }
      if(methode==='PUT'&&!act){
        if(!tokOk) return err(400,'Jeton visiteur invalide.');
        const v=valider(corps); if(typeof v==='string') return err(400,v);
        if(!a||!publique(a,tok).est_proprietaire) return err(403,"Non autorisé (astuce introuvable ou ce n'est pas la vôtre).");
        Object.assign(a,v,{date_modification:new Date().toISOString()}); return reponse(200,{succes:true,data:publique(a,tok)});
      }
      if(methode==='DELETE'&&!act){
        if(!tokOk) return err(400,'Jeton visiteur invalide.');
        if(!a||!publique(a,tok).est_proprietaire) return err(403,"Non autorisé (astuce introuvable ou ce n'est pas la vôtre).");
        base=base.filter(x=>x.id!==id); return reponse(200,{succes:true,message:'Astuce supprimée.'});
      }
      if(methode==='POST'&&act){
        if(!tokOk) return err(400,'Jeton visiteur invalide.');
        if(!a) return err(404,'Astuce introuvable.');
        const cle=id+'|'+tok;
        if(act==='like'){ if(!likes.has(cle)){likes.add(cle);a.likes++} return reponse(200,{succes:true,likes:a.likes,aLike:true}) }
        if(act==='unlike'){ if(likes.has(cle)){likes.delete(cle);a.likes=Math.max(0,a.likes-1)} return reponse(200,{succes:true,likes:a.likes,aLike:false}) }
        if(act==='vue'){ if(!vues.has(cle)){vues.add(cle);a.vues++} return reponse(200,{succes:true,vues:a.vues}) }
      }
    }
    return err(404,'Introuvable.');
  }
  const fetchReel=window.fetch.bind(window);
  window.fetch=function(url,opts){
    const s=typeof url==='string'?url:(url&&url.url)||'';
    if(/^\/api\/astuces(\/|\?|$)/.test(s)) return serveur(s,opts||{});
    return fetchReel(url,opts);
  };
  window.__demoReset=function(){base=depart();likes.clear();vues.clear();nextId=100};
})();
</script>

function ico(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(ICONES[n]||'')+'</svg>'}
// Sprite pour les <use href="#i-..."> du HTML statique
(function(){

  document.body.prepend(s);
})();

/* ----- Utilitaires ----- */
const $=(id)=>document.getElementById(id);
const memoire={};
function lire(k){try{return localStorage.getItem(k)}catch(e){return memoire[k]||null}}
function ecrire(k,v){try{localStorage.setItem(k,v)}catch(e){memoire[k]=v}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function tempsEcoule(iso){
  const d=new Date(iso),m=Math.floor((Date.now()-d)/60000);
  if(m<1)return "À l'instant"; if(m<60)return 'Il y a '+m+' min';
  const hh=Math.floor(m/60); if(hh<24)return 'Il y a '+hh+' h';
  const jj=Math.floor(hh/24); if(jj<30)return 'Il y a '+jj+' j';
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
}
function pluriel(n,mot){return n+' '+mot+(n>1?'s':'')}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

/* ----- Jeton visiteur (même clé qu'avant : les astuces déjà publiées restent à leur auteur) ----- */
let monToken=lire('virttech_user_token');
if(!monToken||monToken.length<8){
  monToken=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
  ecrire('virttech_user_token',monToken);
}

/* ----- API ----- */
async function api(chemin,{methode='GET',corps}={}){
  const opts={method:methode,headers:{'x-visiteur-token':monToken}};
  if(corps){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(corps)}
  let res;
  try{res=await fetch('/api/astuces'+chemin,opts)}catch(e){throw new Error('Connexion impossible. Vérifiez votre réseau et réessayez.')}
  let data=null;try{data=await res.json()}catch(e){}
  if(!res.ok||!data||!data.succes){
    const e=new Error((data&&data.message)||'Une erreur est survenue. Réessayez dans un instant.');
    e.status=res.status;throw e;
  }
  return data;
}

/* ----- État ----- */
const etat={onglet:'toutes',recherche:'',langage:'',niveau:'',tri:'recentes',page:0,aPlus:false,total:0,charge:false,req:0,items:new Map(),edition:null,vuesEnvoyees:new Set(),duJourId:null};

/* ----- Toasts ----- */
function toast(message,type){
  const t=document.createElement('div');t.className='toast'+(type==='erreur'?' erreur':'');
  t.innerHTML=ico(type==='erreur'?'alerte':'check')+'<span>'+esc(message)+'</span>';
  $('toasts').appendChild(t);setTimeout(()=>t.remove(),type==='erreur'?5000:3200);
}

/* ----- Confirmation ----- */
function confirmer(titre,message,actions){
  $('ovTitre').textContent=titre;$('ovMessage').textContent=message;
  const c=$('ovActions');c.innerHTML='';
  actions.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='btn-ov '+a.classe;b.textContent=a.texte;b.onclick=()=>{fermerConfirm();a.fn&&a.fn()};c.appendChild(b)});
  $('overlayGlobal').classList.add('ouvert');
  const dernier=c.lastElementChild;dernier&&dernier.focus();
}
function fermerConfirm(){$('overlayGlobal').classList.remove('ouvert')}

/* ----- Rendu d'une carte ----- */
function niveauHTML(n){
  const rang=Math.max(0,NIVEAUX.indexOf(n))+1;
  return '<div class="niveau"><span class="niveau-barres" aria-hidden="true"><i class="'+(rang>=1?'on':'')+'"></i><i class="'+(rang>=2?'on':'')+'"></i><i class="'+(rang>=3?'on':'')+'"></i></span><span>'+esc(n)+'</span></div>';
}
function carteHTML(a,detail){
  let code='';
  if(a.code){
    const long=a.code.split('\n').length>8;
    const coupe=!detail&&long;
    code='<div class="code-wrapper'+(coupe?' coupe-wrap':'')+'"><div class="code-header"><span class="code-lang">'+esc(a.langage)+'</span>'
      +'<button class="btn-copy" type="button" data-act="copier" data-id="'+a.id+'">'+ico('copy')+' Copier</button></div>'
      +'<div class="code-content'+(coupe?' coupe':'')+'"><pre><code class="language-'+(PRISM[a.langage]||'none')+'">'+esc(a.code)+'</code></pre></div></div>';
  }
  const moi=a.est_proprietaire;
  const actionsProprio=moi?'<button class="social-btn" type="button" data-act="modifier" data-id="'+a.id+'" title="Modifier" aria-label="Modifier">'+ico('pen')+'</button>'
    +'<button class="social-btn danger" type="button" data-act="supprimer" data-id="'+a.id+'" title="Supprimer" aria-label="Supprimer">'+ico('trash')+'</button>':'';
  const modif=a.date_modification?' · modifiée':'';
  return '<article class="card-astuce'+(detail?' detail':'')+'" id="'+(detail?'detail-':'card-')+a.id+'" data-id="'+a.id+'" data-act="ouvrir">'
    +'<div class="card-header"><h3>'+esc(a.titre)+'</h3><span class="tag-langage">'+esc(a.langage)+'</span></div>'
    +niveauHTML(a.niveau)
    +'<div class="card-content">'+esc(a.contenu)+'</div>'
    +code
    +'<div class="card-footer"><div class="social-actions">'
    +'<button class="social-btn'+(a.a_like?' liked':'')+'" type="button" data-act="like" data-like="'+a.id+'" aria-pressed="'+(!!a.a_like)+'" aria-label="J\'aime">'+ico('heart')+'<span class="n-like">'+a.likes+'</span></button>'
    +'<span class="social-btn statique" title="Vues">'+ico('eye')+'<span data-vues="'+a.id+'">'+a.vues+'</span></span>'
    +'<button class="social-btn" type="button" data-act="partager" data-id="'+a.id+'" title="Copier le lien" aria-label="Copier le lien">'+ico('link')+'</button>'
    +actionsProprio+'</div>'
    +'<div class="author-info"><strong>'+esc(a.auteur)+(moi?'<span class="badge-moi">Vous</span>':'')+'</strong><span class="time-post">'+esc(tempsEcoule(a.date_creation))+esc(modif)+'</span></div>'
    +'</div></article>';
}
function colorer(racine){
  if(!window.Prism||!Prism.highlightElement)return;
  racine.querySelectorAll('code[class*="language-"]').forEach(c=>{if(!/language-none/.test(c.className))try{Prism.highlightElement(c)}catch(e){}});
}
function memoriser(liste){liste.forEach(a=>etat.items.set(a.id,a))}

/* ----- Liste ----- */
const grille=$('grilleAstuces');
function paramsListe(){
  const p=new URLSearchParams({page:etat.page+1,limite:LIMITE,tri:etat.tri});
  if(etat.recherche)p.set('recherche',etat.recherche);
  if(etat.langage)p.set('langage',etat.langage);
  if(etat.niveau)p.set('niveau',etat.niveau);
  if(etat.onglet==='mes')p.set('mes','1');
  return p;
}
function filtresActifs(){return !!(etat.recherche||etat.langage||etat.niveau||etat.tri!=='recentes')}
async function charger(reinit){
  if(etat.charge&&!reinit)return;
  const mon=++etat.req;
  etat.charge=true;
  if(reinit){
    etat.page=0;etat.aPlus=false;
    grille.hidden=true;grille.innerHTML='';$('loader').hidden=false;$('plus').hidden=true;$('finListe').hidden=true;
  }else{$('loaderFin').hidden=false;$('plus').hidden=true}
  try{
    const r=await api('?'+paramsListe());
    if(mon!==etat.req)return;
    memoriser(r.data);
    etat.page=r.page;etat.aPlus=r.aPlus;etat.total=r.total;
    if(r.data.length===0&&r.page===1)afficherVide();
    else{
      grille.insertAdjacentHTML('beforeend',r.data.map(a=>carteHTML(a,false)).join(''));
      colorer(grille);
    }
  }catch(e){
    if(mon!==etat.req)return;
    toast(e.message,'erreur');
    if(reinit){grille.innerHTML='<div class="etat-vide">'+ico('alerte')+'<h3>Impossible de charger les astuces</h3><p>'+esc(e.message)+'</p><button class="btn-principal" type="button" data-act="recharger">Réessayer</button></div>'}
  }finally{
    if(mon===etat.req){
      etat.charge=false;$('loader').hidden=true;grille.hidden=false;$('loaderFin').hidden=true;
      $('plus').hidden=!etat.aPlus;
      majCompteur();
    }
  }
}
function majCompteur(){
  const vide=grille.querySelector('.etat-vide');
  $('compteur').textContent=vide?'':pluriel(etat.total,'astuce')+(etat.onglet==='mes'?' publiée':'')+(etat.total>1&&etat.onglet==='mes'?'s par vous':etat.onglet==='mes'?' par vous':'');
  $('btnReset').hidden=!filtresActifs();
  const fin=$('finListe');
  if(!vide&&!etat.aPlus&&etat.total>LIMITE){fin.textContent='Vous avez tout vu. '+pluriel(etat.total,'astuce')+' au total.';fin.hidden=false}else fin.hidden=true;
}
function afficherVide(){
  let titre,msg,btn='';
  if(etat.recherche||etat.langage||etat.niveau){
    titre='Aucune astuce ne correspond';msg='Essayez un autre mot, un autre langage ou retirez un filtre.';
    btn='<button class="btn-principal" type="button" data-act="reset">Réinitialiser les filtres</button>';
  }else if(etat.onglet==='mes'){
    titre="Vous n'avez rien publié";msg='Partagez votre première astuce avec la communauté. Elle apparaîtra ici.';
    btn='<button class="btn-principal" type="button" data-act="nouvelle">'+ico('plus')+' Publier ma première astuce</button>';
  }else{
    titre='Soyez le premier à publier ici';msg="Aucune astuce n'a encore été partagée sur VirtTech.";
    btn='<button class="btn-principal" type="button" data-act="nouvelle">'+ico('plus')+' Écrire une astuce</button>';
  }
  grille.innerHTML='<div class="etat-vide">'+ico('bulb')+'<h3>'+titre+'</h3><p>'+msg+'</p>'+btn+'</div>';
}
function remplacerCarte(a){
  etat.items.set(a.id,a);
  const n=$('card-'+a.id);
  if(n){const tmp=document.createElement('div');tmp.innerHTML=carteHTML(a,false);const nv=tmp.firstElementChild;n.replaceWith(nv);colorer(nv)}
  const d=$('detail-'+a.id);
  if(d){const tmp=document.createElement('div');tmp.innerHTML=carteHTML(a,true);const nv=tmp.firstElementChild;d.replaceWith(nv);colorer(nv)}
}

/* ----- Stats et astuce du jour ----- */
async function chargerStats(){
  try{
    const r=await api('/stats');const s=r.data;
    $('stats').innerHTML='<b>'+s.astuces+'</b> astuces · <b>'+s.contributeurs+'</b> contributeurs · <b>'+s.langages+'</b> langages';
  }catch(e){$('stats').textContent=''}
}
async function chargerDuJour(){
  const z=$('duJourZone');
  try{
    const r=await api('/du-jour');const a=r.data;
    if(!a){z.hidden=true;return}
    etat.items.set(a.id,a);etat.duJourId=a.id;
    z.innerHTML='<button class="du-jour" type="button" data-act="ouvrir" data-id="'+a.id+'"><span class="dj-icone">'+ico('bulb')+'</span>'
      +'<span class="dj-texte"><span class="dj-label">Astuce du jour</span><span class="dj-titre">'+esc(a.titre)+'</span>'
      +'<span class="dj-meta">'+esc(a.langage)+' · '+esc(a.niveau)+' · par '+esc(a.auteur)+'</span></span>'
      +'<span class="dj-cta">Lire l\'astuce</span></button>';
    z.hidden=false;
  }catch(e){z.hidden=true}
}

/* ----- Détail ----- */
async function ouvrirDetail(id,viaLien){
  let a=etat.items.get(id);
  if(!a||viaLien){
    try{a=(await api('/'+id)).data;etat.items.set(id,a)}
    catch(e){toast(e.status===404?"Cette astuce n'existe plus.":e.message,'erreur');return}
  }
  $('detailCorps').innerHTML=carteHTML(a,true);colorer($('detailCorps'));
  $('detailBg').classList.add('ouvert');$('detailFermer').focus();
  try{history.replaceState(null,'',location.pathname+location.search+'#'+id)}catch(e){}
  enregistrerVue(id);
}
function fermerDetail(){
  $('detailBg').classList.remove('ouvert');
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
}
async function enregistrerVue(id){
  if(etat.vuesEnvoyees.has(id))return;
  etat.vuesEnvoyees.add(id);
  try{
    const r=await api('/'+id+'/vue',{methode:'POST'});
    const a=etat.items.get(id);if(a)a.vues=r.vues;
    document.querySelectorAll('[data-vues="'+id+'"]').forEach(n=>n.textContent=r.vues);
  }catch(e){etat.vuesEnvoyees.delete(id)}
}

/* ----- Likes ----- */
function majLike(id){
  const a=etat.items.get(id);if(!a)return;
  document.querySelectorAll('[data-like="'+id+'"]').forEach(b=>{
    b.classList.toggle('liked',!!a.a_like);b.setAttribute('aria-pressed',!!a.a_like);
    b.querySelector('.n-like').textContent=a.likes;
  });
}
async function basculerLike(id,btn){
  const a=etat.items.get(id);if(!a||btn.dataset.occupe)return;
  btn.dataset.occupe='1';
  const avant={likes:a.likes,a_like:a.a_like};
  const veut=!a.a_like;a.a_like=veut;a.likes+=veut?1:-1;majLike(id);
  try{
    const r=await api('/'+id+'/'+(veut?'like':'unlike'),{methode:'POST'});
    a.likes=r.likes;a.a_like=r.aLike;
  }catch(e){Object.assign(a,avant);toast(e.message,'erreur')}
  finally{delete btn.dataset.occupe;majLike(id)}
}

/* ----- Copier / partager ----- */
async function copierTexte(texte){
  try{await navigator.clipboard.writeText(texte);return true}
  catch(e){
    try{const t=document.createElement('textarea');t.value=texte;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}
    catch(e2){return false}
  }
}
async function copierCode(btn,id){
  const a=etat.items.get(id);if(!a||!a.code)return;
  const ok=await copierTexte(a.code);
  const orig=btn.innerHTML;
  btn.innerHTML=ok?ico('check')+' Copié':ico('alerte')+' Échec';btn.classList.toggle('ok',ok);
  setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove('ok')},1800);
}
async function partager(id){
  const lien=location.href.split('#')[0]+'#'+id;
  const ok=await copierTexte(lien);
  toast(ok?'Lien copié':'Copie impossible. Lien : '+lien,ok?'':'erreur');
}

/* ----- Suppression ----- */
function demanderSuppression(id){
  const a=etat.items.get(id);
  confirmer("Supprimer l'astuce ?",'« '+(a?a.titre:'')+' » sera supprimée définitivement, avec ses likes et ses vues.',[
    {texte:'Annuler',classe:'btn-ov-annuler'},
    {texte:'Supprimer',classe:'btn-ov-danger',fn:()=>supprimer(id)}
  ]);
}
async function supprimer(id){
  try{
    await api('/'+id,{methode:'DELETE'});
    etat.items.delete(id);fermerDetail();
    const n=$('card-'+id);if(n)n.remove();
    etat.total=Math.max(0,etat.total-1);
    if(!grille.querySelector('.card-astuce'))charger(true);else majCompteur();
    chargerStats();if(etat.duJourId===id)chargerDuJour();
    toast('Astuce supprimée');
  }catch(e){toast(e.message,'erreur')}
}

/* ----- Formulaire ----- */
const champs={auteur:$('inputAuteur'),titre:$('inputTitre'),contenu:$('inputContenu'),code:$('inputCode'),langage:$('inputLangage')};
const LIM={auteur:[2,50],titre:[3,120],contenu:[5,2000],code:[0,10000]};
const MSG={auteur:'Le nom doit faire entre 2 et 50 caractères.',titre:'Le titre doit faire entre 3 et 120 caractères.',contenu:"L'explication doit faire entre 5 et 2000 caractères.",code:'Le code est trop long (10 000 caractères maximum).'};
function niveauChoisi(){const r=document.querySelector('input[name="niveau"]:checked');return r?r.value:'Débutant'}
function compteurs(){
  [['auteur','cptAuteur',50],['titre','cptTitre',120],['contenu','cptContenu',2000],['code','cptCode',10000]].forEach(([k,id,m])=>{$(id).textContent=champs[k].value.length+'/'+m});
}
function erreurChamp(k,msg){
  const g=document.querySelector('[data-champ="'+k+'"]');if(!g)return;
  g.classList.toggle('invalide',!!msg);g.querySelector('.msg-erreur').textContent=msg||'';
  champs[k].setAttribute('aria-invalid',msg?'true':'false');
}
function valider(){
  let premier=null;
  Object.keys(LIM).forEach(k=>{
    const v=champs[k].value.replace(/\r\n/g,'\n').trim();
    const mauvais=v.length<LIM[k][0]||v.length>LIM[k][1];
    erreurChamp(k,mauvais?MSG[k]:'');
    if(mauvais&&!premier)premier=champs[k];
  });
  if(premier){premier.focus();return false}
  return true;
}
function ouvrirForm(a){
  etat.edition=a?a.id:null;
  $('formTitreTexte').textContent=a?"Modifier l'astuce":'Nouvelle astuce';
  $('btnPublierTexte').textContent=a?'Enregistrer':'Publier';
  champs.auteur.value=a?a.auteur:(lire('virttech_auteur')||'');
  champs.titre.value=a?a.titre:'';champs.contenu.value=a?a.contenu:'';champs.code.value=a&&a.code?a.code:'';
  champs.langage.value=a?a.langage:'JavaScript';
  const niv=a?a.niveau:'Débutant';
  document.querySelectorAll('input[name="niveau"]').forEach(r=>r.checked=r.value===niv);
  Object.keys(LIM).forEach(k=>erreurChamp(k,''));compteurs();
  fermerDetail();
  $('slideOverlay').classList.add('ouvert');$('slidePanel').classList.add('ouvert');
  setTimeout(()=>(a?champs.titre:champs.auteur.value?champs.titre:champs.auteur).focus(),150);
}
function formModifie(){
  const a=etat.edition?etat.items.get(etat.edition):null;
  const actuel=[champs.auteur.value.trim(),champs.titre.value.trim(),champs.contenu.value.trim(),champs.code.value.trim()];
  if(a)return actuel.join('\u0001')!==[a.auteur,a.titre,a.contenu,a.code||''].join('\u0001');
  return actuel.slice(1).some(Boolean);
}
function fermerForm(force){
  if(!force&&formModifie()){
    confirmer('Quitter sans enregistrer ?','Vos modifications seront perdues.',[
      {texte:'Continuer',classe:'btn-ov-annuler'},
      {texte:'Quitter',classe:'btn-ov-confirmer',fn:()=>fermerForm(true)}
    ]);return;
  }
  $('slideOverlay').classList.remove('ouvert');$('slidePanel').classList.remove('ouvert');
  etat.edition=null;
}
async function envoyerForm(){
  if(!valider())return;
  const corps={auteur:champs.auteur.value,titre:champs.titre.value,contenu:champs.contenu.value,langage:champs.langage.value,niveau:niveauChoisi(),code:champs.code.value};
  const b=$('btnPublier');b.disabled=true;
  const edition=etat.edition;
  try{
    const r=edition?await api('/'+edition,{methode:'PUT',corps}):await api('',{methode:'POST',corps});
    ecrire('virttech_auteur',corps.auteur.trim());
    fermerForm(true);
    if(edition){remplacerCarte(r.data);toast('Astuce enregistrée');if(etat.duJourId===edition)chargerDuJour()}
    else{
      etat.onglet='toutes';etat.recherche='';etat.langage='';etat.niveau='';etat.tri='recentes';majControles();
      charger(true);window.scrollTo({top:0,behavior:'smooth'});toast('Astuce publiée');
    }
    chargerStats();
  }catch(e){
    toast(e.message,'erreur');
    if(e.status===400){const m=e.message.toLowerCase();['auteur','titre','contenu','code'].forEach(k=>{if(m.includes(k==='contenu'?'explication':k==='auteur'?'nom':k))erreurChamp(k,e.message)})}
  }finally{b.disabled=false}
}

/* ----- Contrôles ----- */
function majControles(){
  $('fRecherche').value=etat.recherche;$('fLangage').value=etat.langage;$('fNiveau').value=etat.niveau;$('fTri').value=etat.tri;
  document.querySelectorAll('.tab-btn').forEach(t=>{const on=t.dataset.onglet===etat.onglet;t.classList.toggle('actif',on);t.setAttribute('aria-selected',on)});
}
function reinitFiltres(){etat.recherche='';etat.langage='';etat.niveau='';etat.tri='recentes';majControles();charger(true)}

/* ----- Initialisation ----- */
function init(){
  // Menu (en prod : géré par header.js)
  const menu=[['house','Accueil'],['clock',"Historique d'activité"],['code','VirtEmulator'],['link','TransformLink'],['bulb','Astuces',1],['trophy','Résultats Virt_Dev'],['news','Actualités'],['info','À propos'],['mail','Contact']];
  $('menuNav').innerHTML=menu.map(m=>'<li><a href="#" data-demo class="'+(m[2]?'actif':'')+'"><span>'+m[1]+'</span>'+ico(m[0])+'</a></li>').join('');
  const b=$('burger'),sd=$('side'),v=$('voile');
  function ouvrir(o){sd.classList.toggle('ouvert',o);v.classList.toggle('ouvert',o);b.setAttribute('aria-expanded',o);(o?$('fermer'):b).focus()}
  b.onclick=()=>ouvrir(true);$('fermer').onclick=()=>ouvrir(false);v.onclick=()=>ouvrir(false);
  document.addEventListener('click',e=>{const l=e.target.closest('a[data-demo]');if(l){e.preventDefault();if(sd.classList.contains('ouvert'))ouvrir(false)}});

  // Selects
  $('fLangage').innerHTML='<option value="">Tous les langages</option>'+LANGAGES.map(l=>'<option>'+l+'</option>').join('');
  $('fNiveau').innerHTML='<option value="">Tous les niveaux</option>'+NIVEAUX.map(n=>'<option>'+n+'</option>').join('');
  champs.langage.innerHTML=LANGAGES.map(l=>'<option>'+l+'</option>').join('');
  $('niveauChoix').innerHTML=NIVEAUX.map((n,i)=>'<input type="radio" name="niveau" id="niv'+i+'" value="'+n+'"'+(i===0?' checked':'')+'><label for="niv'+i+'">'+niveauHTML(n).replace('class="niveau"','class="niveau" style="padding:0"')+'</label>').join('');

  // Onglets et filtres
  document.querySelectorAll('.tab-btn').forEach(t=>t.onclick=()=>{etat.onglet=t.dataset.onglet;majControles();charger(true)});
  $('fRecherche').addEventListener('input',debounce(e=>{etat.recherche=e.target.value.trim();charger(true)},300));
  $('fLangage').onchange=e=>{etat.langage=e.target.value;charger(true)};
  $('fNiveau').onchange=e=>{etat.niveau=e.target.value;charger(true)};
  $('fTri').onchange=e=>{etat.tri=e.target.value;charger(true)};
  $('btnReset').onclick=reinitFiltres;
  $('btnPlus').onclick=()=>charger(false);

  // Chargement progressif
  if('IntersectionObserver' in window){
    new IntersectionObserver(es=>{if(es[0].isIntersecting&&etat.aPlus&&!etat.charge)charger(false)},{rootMargin:'300px'}).observe($('sentinelle'));
  }

  // Clics (délégation)
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-act]');if(!el)return;
    const act=el.dataset.act;const carte=el.closest('[data-id]');const id=parseInt(el.dataset.id||(carte&&carte.dataset.id),10);
    if(act==='ouvrir'){if(e.target.closest('button:not([data-act="ouvrir"]), a'))return;ouvrirDetail(id)}
    else if(act==='like')basculerLike(id,el);
    else if(act==='copier')copierCode(el,id);
    else if(act==='partager')partager(id);
    else if(act==='modifier')ouvrirForm(etat.items.get(id));
    else if(act==='supprimer')demanderSuppression(id);
    else if(act==='nouvelle')ouvrirForm(null);
    else if(act==='reset')reinitFiltres();
    else if(act==='recharger')charger(true);
  });
  $('btnAjouter').onclick=()=>ouvrirForm(null);
  $('btnFormFermer').onclick=()=>fermerForm(false);
  $('slideOverlay').onclick=()=>fermerForm(false);
  $('btnPublier').onclick=envoyerForm;
  $('formAstuce').addEventListener('submit',e=>{e.preventDefault();envoyerForm()});
  ['auteur','titre','contenu','code'].forEach(k=>champs[k].addEventListener('input',()=>{compteurs();if(champs[k].closest('.invalide'))erreurChamp(k,'')}));
  champs.code.addEventListener('keydown',e=>{
    if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();const t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+2;compteurs()}
  });
  $('detailFermer').onclick=fermerDetail;
  $('detailBg').addEventListener('click',e=>{if(e.target===$('detailBg'))fermerDetail()});
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape')return;
    if($('overlayGlobal').classList.contains('ouvert'))fermerConfirm();
    else if($('slidePanel').classList.contains('ouvert'))fermerForm(false);
    else if($('detailBg').classList.contains('ouvert'))fermerDetail();
    else if($('side').classList.contains('ouvert'))ouvrir(false);
  });

  // Lien de partage /astuces#12
  function depuisHash(){const m=location.hash.match(/^#(\d+)$/);if(m)ouvrirDetail(parseInt(m[1],10),true)}
  window.addEventListener('hashchange',()=>{if(/^#\d+$/.test(location.hash)&&!$('detailBg').classList.contains('ouvert'))depuisHash()});

  // Outils de la démo
  $('btnDemo429').onclick=()=>{window.__forcer429=true;toast("La prochaine action (like, publication…) renverra une erreur 429.")};
  $('btnDemoReset').onclick=()=>{window.__demoReset();etat.items.clear();etat.vuesEnvoyees.clear();charger(true);chargerStats();chargerDuJour();toast('Données de départ rétablies')};

  majControles();
  charger(true);chargerStats();chargerDuJour();depuisHash();
}
init();
})();
</script>
