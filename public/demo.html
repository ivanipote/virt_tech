<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Démo - Samsung Chrome Interactif</title>
<style>
    body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }

    /* LE TÉLÉPHONE SAMSUNG */
    .phone-samsung { 
        width: 300px; height: 620px; background: #000; border-radius: 35px; 
        border: 4px solid #333; position: relative; overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        display: flex; flex-direction: column;
    }

    .punch-hole {
        position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
        width: 12px; height: 12px; background: #000; border-radius: 50%; z-index: 100;
        box-shadow: inset 0 0 2px #000, 0 0 2px #333;
    }

    /* BARRE D'ÉTAT */
    .status-bar { 
        height: 35px; display: flex; justify-content: space-between; align-items: center; 
        padding: 0 20px; color: #fff; font-size: 0.75rem; font-weight: 600; 
        background: #111; z-index: 10; padding-top: 5px;
    }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .status-icons svg { width: 14px; height: 14px; fill: #fff; }

    /* BARRE CHROME */
    .chrome-bar {
        background: #202124; padding: 10px 12px; display: flex; align-items: center; gap: 10px;
        z-index: 10; border-bottom: 1px solid #333;
    }
    
    .chrome-tabs { display: flex; gap: 15px; color: #9aa0a6; cursor: pointer; }
    .chrome-tabs svg { width: 20px; height: 20px; fill: currentColor; transition: 0.2s; }
    .chrome-tabs svg:active { fill: #fff; transform: scale(0.9); }
    
    /* BARRE D'ADRESSE ÉDITABLE */
    .chrome-address-bar {
        flex: 1; background: #35363a; border-radius: 20px; padding: 8px 15px;
        display: flex; align-items: center; gap: 10px; color: #e8eaed; font-size: 0.8rem;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); cursor: text;
    }
    .chrome-address-bar:focus-within { background: #444; }
    .chrome-address-bar input {
        background: transparent; border: none; color: #fff; outline: none; width: 100%;
        font-size: 0.8rem; font-family: inherit;
    }
    .chrome-address-bar svg { width: 14px; height: 14px; fill: #9aa0a6; flex-shrink: 0; }

    /* ZONE DU SITE WEB */
    .site-content { flex: 1; background: #fff; position: relative; overflow: hidden; display: flex; flex-direction: column; }

    /* BARRE DE CHARGEMENT */
    .loading-bar-container { height: 3px; background: #e0e0e0; width: 100%; position: absolute; top: 0; left: 0; z-index: 20; display: none; }
    .loading-bar-container.active { display: block; }
    .loading-bar { height: 100%; background: #4285f4; width: 0%; animation: charger 1s infinite ease-in-out; }
    @keyframes charger { 0% { width: 0%; } 50% { width: 80%; } 100% { width: 100%; } }

    /* L'IFRAME QUI CHARGE LE VRAI SITE */
    #browserIframe {
        width: 100%; height: 100%; border: none; display: none; background: #fff;
    }

    /* PAGE D'ACCUEIL PAR DÉFAUT */
    .fake-website { padding: 40px 20px; text-align: center; color: #333; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }
    .fake-website h1 { font-size: 1.5rem; color: #0B2545; margin-bottom: 10px; }
    .fake-website p { font-size: 0.9rem; color: #666; line-height: 1.5; }
    .fake-website .note { margin-top: 20px; font-size: 0.7rem; color: #999; background: #f0f0f0; padding: 5px 10px; border-radius: 10px; }

    /* BOUTON DE TEST */
    .test-btn { background: #0B2545; color: white; padding: 10px 20px; border-radius: 5px; margin-top: 20px; font-size: 0.9rem; border: none; cursor: pointer; font-weight: bold; }
    .test-btn:active { background: #D4AF37; color: #000; }
</style>
</head>
<body>

    <div class="phone-samsung">
        <div class="punch-hole"></div>

        <!-- Barre d'état -->
        <div class="status-bar">
            <span>9:41</span>
            <span class="status-icons">
                <svg viewBox="0 0 24 24"><path d="M12 21L15.6 16.2C14.6 15.5 13.3 15 12 15C10.7 15 9.4 15.5 8.4 16.2L12 21ZM12 3C7.95 3 4.21 4.34 1.2 6.6L3 9C5.5 7.12 8.62 6 12 6C15.38 6 18.5 7.12 21 9L22.8 6.6C19.79 4.34 16.05 3 12 3ZM12 9C9.17 9 6.57 10 4.53 11.7L6.33 14.1C7.89 12.8 9.9 12 12 12C14.1 12 16.11 12.8 17.67 14.1L19.47 11.7C17.43 10 14.83 9 12 9Z"/></svg>
                <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </span>
        </div>

        <!-- Barre Chrome -->
        <div class="chrome-bar">
            <div class="chrome-tabs" onclick="simulerAction('Retour')">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </div>
            <div class="chrome-address-bar">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <input type="text" id="urlInput" value="virttech.site" onkeypress="handleEnter(event)" spellcheck="false">
            </div>
            <div class="chrome-tabs" onclick="simulerAction('Menu')">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </div>
        </div>

        <!-- Contenu du site -->
        <div class="site-content">
            <div class="loading-bar-container" id="loadingBar"><div class="loading-bar"></div></div>
            
            <!-- L'iframe qui affichera le vrai site -->
            <iframe id="browserIframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

            <!-- Page d'accueil -->
            <div class="fake-website" id="pageContent">
                <h1>Bienvenue</h1>
                <p>Tape une URL ci-dessus et appuie sur Entrée pour naviguer.</p>
                <button class="test-btn" onclick="document.getElementById('urlInput').value='wikipedia.org'; handleEnter({key:'Enter'})">Tester avec Wikipédia</button>
                <div class="note">⚠️ Certains sites (Google, YouTube) refusent l'affichage intégré pour des raisons de sécurité.</div>
            </div>
        </div>
    </div>

    <script>
        // Fonction pour les boutons retour/menu
        function simulerAction(action) {
            alert("Action simulée : " + action);
        }

        // Fonction pour charger une URL
        function handleEnter(e) {
            if (e.key === 'Enter') {
                let url = document.getElementById('urlInput').value.trim();
                
                if (!url) return;

                // On ajoute https:// si besoin
                if (!url.startsWith('http')) {
                    url = 'https://' + url;
                }

                const iframe = document.getElementById('browserIframe');
                const pageContent = document.getElementById('pageContent');
                const loadingBar = document.getElementById('loadingBar');

                // On cache la page d'accueil, on montre l'iframe
                pageContent.style.display = 'none';
                iframe.style.display = 'block';
                loadingBar.classList.add('active');

                // On utilise un proxy CORS gratuit pour contourner les blocages
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
                
                iframe.src = proxyUrl;

                // Quand le chargement est terminé
                iframe.onload = function() {
                    loadingBar.classList.remove('active');
                };

                // En cas d'erreur
                iframe.onerror = function() {
                    loadingBar.classList.remove('active');
                    alert("Impossible de charger cette page. Le site refuse peut-être l'affichage.");
                };
            }
        }
    </script>

</body>
</html>
