<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VirtEmulator - L'éditeur de code en ligne | VirtTech</title>

<!-- SEO -->
<meta name="description" content="Teste ton code HTML, CSS et JavaScript avec VirtEmulator. Crée plusieurs fichiers, sauvegarde et visualise ton rendu mobile." />
<meta property="og:title" content="VirtEmulator - L'éditeur de code en ligne" />
<meta property="og:image" content="https://virttech.site/logo.png" />
<meta property="og:url" content="https://virttech.site/virtemulator" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="VirtTech" />
<meta name="twitter:card" content="summary_large_image" />

<!-- CSS -->
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/virtemulator.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
</head>
<body>

<div class="emulator-container">
    <!-- HEADER AVEC ONGLETS ET BOUTONS -->
    <div class="editor-header-wrapper">
        <div class="editor-tabs" id="editorHeader">
            <!-- Les onglets seront injectés ici par JS -->
        </div>
        <div class="editor-actions">
            <button class="btn-header-action" id="btnExportCode" title="Télécharger le fichier">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Exporter
            </button>
            <button class="btn-header-action" id="btnSaveCode" title="Enregistrer dans le navigateur">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                Save
            </button>
        </div>
    </div>

    <!-- ZONE DE CODE -->
    <div class="editor-body" id="editorBody">
        <textarea id="codeInput" style="display:none;"></textarea>
    </div>
</div>

<!-- BOUTON PLAY -->
<button class="btn-play-footer" id="btnPlay" title="Voir le rendu">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
</button>

<!-- OVERLAY CREATION DE FICHIER -->
<div class="overlay-create" id="overlayCreate">
    <div class="modal-create">
        <h3>Nouveau fichier</h3>
        <input type="text" id="inputNomFichier" placeholder="ex: page2.html">
        <div class="btns">
            <button class="btn-annuler" id="btnAnnulerCreate">Annuler</button>
            <button class="btn-creer" id="btnValiderCreate">Créer</button>
        </div>
    </div>
</div>

<!-- SLIDE MOBILE -->
<div class="slide-overlay" id="slideOverlay"></div>
<div class="slide-panel" id="slidePanel">
    <div class="slide-header">
        <h3 id="slideTitle">Aperçu</h3>
        <button class="btn-fermer" id="btnFermerSlide">✕</button>
    </div>
    <div class="slide-content">
        <div class="iphone-frame">
            <div class="notch"></div>
            <div class="iphone-screen">
                <iframe id="mobileIframe" title="Aperçu mobile"></iframe>
            </div>
        </div>
    </div>
    <!-- Boutons de zoom -->
    <div class="zoom-controls">
        <button class="btn-zoom" id="btnZoomOut" title="Zoom arrière">-</button>
        <button class="btn-zoom" id="btnZoomIn" title="Zoom avant">+</button>
    </div>
</div>

<!-- Scripts -->
<script src="/js/header.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="/js/virtemulator.js"></script>

</body>
</html>
