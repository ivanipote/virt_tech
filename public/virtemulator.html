<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VirtEmulator - L'éditeur de code en ligne | VirtTech</title>

<!-- SEO -->
<meta name="description" content="Teste ton code HTML, CSS et JavaScript avec VirtEmulator. Crée plusieurs fichiers, sauvegarde et visualise ton rendu mobile." />
<meta property="og:title" content="VirtEmulator - L'éditeur de code en ligne" />
<meta property="og:image" content="https://virttech.site/logo.png" />
<meta property="og:url" content="https://virttech.site/virtemulator" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="VirtTech" />
<meta name="twitter:card" content="summary_large_image" />

<!-- CSS -->
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/virtemulator.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
</head>
<body>

<div class="emulator-container">
    <!-- HEADER AVEC ONGLETS ET BOUTONS -->
    <div class="editor-header-wrapper">
        <div class="editor-tabs" id="editorHeader">
            <!-- Les onglets seront injectés ici par JS -->
        </div>
        <div class="editor-actions">
            <button class="btn-header-action" id="btnExportCode" title="Télécharger le fichier">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Exporter
            </button>
            <button class="btn-header-action" id="btnSaveCode" title="Enregistrer dans le navigateur">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                Save
            </button>
        </div>
    </div>

    <!-- ZONE DE CODE (le body de l'éditeur) -->
    <div class="editor-body" id="editorBody">
        <textarea id="codeInput" style="display:none;"></textarea>
    </div>
</div>

<!-- BOUTON PLAY -->
<button class="btn-play-footer" id="btnPlay" title="Voir le rendu">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
</button>

<!-- OVERLAY CREATION DE FICHIER -->
<div class="overlay-create" id="overlayCreate">
    <div class="modal-create">
        <h3>Nouveau fichier</h3>
        <input type="text" id="inputNomFichier" placeholder="ex: page2.html">
        <div class="btns">
            <button class="btn-annuler" id="btnAnnulerCreate">Annuler</button>
            <button class="btn-creer" id="btnValiderCreate">Créer</button>
        </div>
    </div>
</div>

<!-- SLIDE MOBILE -->
<div class="slide-overlay" id="slideOverlay"></div>
<div class="slide-panel" id="slidePanel">
    <div class="slide-header">
        <h3 id="slideTitle">Aperçu</h3>
        <div style="display: flex; align-items: center; gap: 10px;">
            <!-- Boutons de zoom déplacés ici -->
            <button class="btn-zoom-header" id="btnZoomOut" title="Zoom arrière">-</button>
            <button class="btn-zoom-header" id="btnZoomIn" title="Zoom avant">+</button>
            <button class="btn-fermer" id="btnFermerSlide">✕</button>
        </div>
    </div>
    <div class="slide-content">
        <div class="iphone-frame">
            <!-- Barre d'état Android -->
            <div class="status-bar">
                <span class="status-time">12:30</span>
                <span class="status-icons">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M2 22h20V2z"/></svg>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
                </span>
            </div>
            <!-- Écran -->
            <div class="iphone-screen">
                <iframe id="mobileIframe" title="Aperçu mobile"></iframe>
            </div>
            <!-- Boutons de navigation Android -->
            <div class="nav-bar-android">
                <div class="nav-btn"></div>
                <div class="nav-btn home"></div>
                <div class="nav-btn"></div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="/js/header.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="/js/virtemulator.js"></script>

</body>
</html>
