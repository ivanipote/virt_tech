<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journée de la Paix - VirtTech</title>
<meta name="description" content="En cette journée de la paix, partagez vos histoires. Un espace anonyme et bienveillant." />
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/paix.css">
</head>
<body>

<script src="/js/header.js"></script>

<div class="contenu-paix">
    <h1 class="reveal">Journée de la Paix</h1>
    <p class="sous-titre reveal" style="--d:.1s">Un espace anonyme pour déposer ce qui est trop lourd à porter.</p>

    <div class="filtre-container reveal" style="--d:.2s">
        <button class="btn-filtre actif" id="btnToutes">Toutes les histoires</button>
        <button class="btn-filtre" id="btnMiennes">Mes histoires</button>
    </div>

    <div class="grille-histoires" id="grilleHistoires">
        <div class="loading">Chargement des histoires...</div>
    </div>
</div>

<button class="btn-story-flottant" id="btnStory">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    Raconter mon histoire
</button>

<!-- MODAL D'ECRITURE -->
<div class="modal-overlay" id="modalStory">
    <div class="modal-contenu">
        <button class="btn-fermer-modal" id="btnFermerModal">✕</button>
        <h2>Écrire mon histoire</h2>
        <p style="color: var(--metal-moyen); font-size: 0.9rem; margin-bottom: 20px;">Votre message sera anonyme.</p>
        
        <div class="form-group">
            <label for="pseudo">Votre pseudo (optionnel)</label>
            <input type="text" id="pseudo" placeholder="Ex: Anonyme #5" maxlength="20">
        </div>
        <div class="form-group">
            <label for="histoireTexte">Votre histoire</label>
            <textarea id="histoireTexte" rows="6" placeholder="Écrivez ce que vous avez sur le cœur..." maxlength="500"></textarea>
        </div>
        <button class="btn-envoyer-story" id="btnEnvoyerStory">Envoyer mon histoire</button>
    </div>
</div>

<!-- NOUVEAU MODAL DE CONFIRMATION DE SUPPRESSION -->
<div class="modal-overlay" id="modalDelete">
    <div class="modal-contenu" style="text-align: center; max-width: 400px;">
        <h2>Supprimer cette histoire ?</h2>
        <p style="color: var(--metal-moyen); margin-bottom: 25px;">Cette action est irréversible. L'histoire sera définitivement supprimée.</p>
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button class="btn-filtre" id="btnAnnulerDelete" style="flex: 1;">Annuler</button>
            <button class="btn-envoyer-story" id="btnValiderDelete" style="flex: 1; background: #e74c3c;">Supprimer</button>
        </div>
    </div>
</div>

<script src="/js/paix.js"></script>
</body>
</html>
