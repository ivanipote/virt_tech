<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page introuvable | VirtTech</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/header.css">
<style>
    .error-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 70vh;
        text-align: center;
        padding: 20px;
    }
    .error-code {
        font-size: 6rem;
        font-weight: 900;
        color: var(--metal-fonce);
        text-shadow: 4px 4px 0 rgba(0,0,0,0.1);
        margin-bottom: 10px;
        animation: float 3s ease-in-out infinite;
    }
    .error-title {
        font-size: 1.8rem;
        color: var(--ombre);
        margin-bottom: 15px;
    }
    .error-text {
        color: var(--metal-moyen);
        margin-bottom: 30px;
        max-width: 400px;
    }
    .btn-retour {
        display: inline-block;
        background: var(--metal-fonce);
        color: var(--blanc);
        text-decoration: none;
        padding: 12px 25px;
        border-radius: 12px;
        font-weight: bold;
        transition: 0.3s;
    }
    .btn-retour:hover {
        background: var(--metal);
        transform: translateY(-2px);
    }
    @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0); }
    }
</style>
</head>
<body>

<script src="/js/header.js"></script>

<div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Oups, cette page n'existe pas !</h1>
    <p class="error-text">Il semblerait que vous ayez suivi un lien brisé ou que la page ait été déplacée.</p>
    <a href="/" class="btn-retour">← Retour à l'accueil</a>
</div>

</body>
</html>
