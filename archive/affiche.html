<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiche - Concours Virt_Dev</title>
<style>
:root{--fond:#CED3D6;--surface:#D9E0E2;--coin:#C8CBD0;--metal:#606A73;--metal-moyen:#515B64;--metal-fonce:#323F48;--ombre:#161F27;--or:#D4AF37;--or-fonce:#B8952D}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
html,body{height:100%;background:var(--ombre);overflow:hidden}
.affiche{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:76px 70px 66px;color:var(--ombre);
  background:radial-gradient(circle at 50% 18%,var(--surface),var(--fond) 55%,var(--coin))}
/* motif discret en fond */
.affiche::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(50,63,72,.05) 0 2px,transparent 2px 90px),repeating-linear-gradient(0deg,rgba(50,63,72,.05) 0 2px,transparent 2px 90px);pointer-events:none}
.affiche>*{position:relative}
.pill{background:linear-gradient(135deg,var(--metal-fonce),var(--ombre));color:var(--surface);font-weight:800;letter-spacing:8px;font-size:30px;padding:16px 46px;border-radius:40px;border:2px solid var(--metal)}
.logo-card{background:#D2D7DA;border:4px solid var(--metal-fonce);border-bottom:12px solid var(--metal);border-radius:34px;padding:10px;box-shadow:0 20px 40px rgba(22,31,39,.35)}
.logo{display:block;width:520px;height:auto;border-radius:24px}
.titre{text-align:center;line-height:1}
.titre small{display:block;font-size:46px;font-weight:700;letter-spacing:20px;color:var(--metal-fonce);margin-bottom:10px;padding-left:20px}
.titre b{display:block;font-size:164px;font-weight:900;letter-spacing:4px;background:linear-gradient(180deg,var(--metal-fonce),var(--ombre));-webkit-background-clip:text;background-clip:text;color:transparent}
.trait{width:520px;height:8px;border-radius:4px;margin:20px auto 0;background:linear-gradient(90deg,var(--metal-fonce),var(--or),var(--metal-fonce))}

/* PODIUM */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:18px;width:100%}
.rang{display:flex;flex-direction:column;align-items:center;width:290px}
.mystere{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:900;margin-bottom:16px;background:var(--surface);color:var(--ombre);border:5px solid var(--metal-fonce);box-shadow:0 10px 24px rgba(22,31,39,.3)}
.rang-1 .mystere{width:120px;height:120px;font-size:78px;border-color:var(--or);margin-bottom:12px}
.couronne{width:150px;margin-bottom:-6px;filter:drop-shadow(0 8px 10px rgba(22,31,39,.35))}
.marche{width:100%;border-radius:22px 22px 0 0;display:flex;justify-content:center;padding-top:22px;font-size:96px;font-weight:900;color:var(--surface);box-shadow:0 14px 30px rgba(22,31,39,.35);border:3px solid var(--metal)}
.rang-2 .marche{height:200px;background:linear-gradient(180deg,var(--metal),var(--metal-fonce))}
.rang-3 .marche{height:135px;background:linear-gradient(180deg,var(--metal-fonce),var(--ombre))}
.rang-1 .marche{height:280px;background:linear-gradient(180deg,var(--or),var(--or-fonce));color:var(--ombre);border-color:var(--or);font-size:130px}
.sol{width:100%;height:14px;margin-top:-2px;border-radius:0 0 8px 8px;background:var(--ombre)}

/* BANDEAU */
.bandeau{width:100%;text-align:center;background:linear-gradient(135deg,var(--metal-fonce),var(--ombre));border:3px solid var(--metal);border-radius:40px;padding:38px 30px 32px;box-shadow:0 20px 40px rgba(22,31,39,.4)}
.bandeau .l1{color:var(--surface);font-size:56px;font-weight:800;letter-spacing:6px}
.bandeau .l2{color:var(--or);font-size:130px;font-weight:900;line-height:1.05;letter-spacing:2px}
.bandeau .l3{color:var(--surface);opacity:.85;font-size:34px;font-weight:600;letter-spacing:3px;margin-top:6px}
.pied{text-align:center;color:var(--metal-fonce);font-size:30px;font-weight:600;line-height:1.5}
.pied b{color:var(--ombre)}
</style>
</head>
