<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virt Tech - Connexion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{min-height:100vh;background:#0A2342;display:flex;justify-content:center;align-items:center}
.iphone{width:390px;height:844px;background:#fff;border:10px solid #000;border-radius:48px;position:relative;overflow:hidden}
.notch{width:135px;height:30px;background:#000;border-radius:0 0 16px 16px;position:absolute;top:0;left:50%;transform:translateX(-50%)}
.screen{padding:65px 28px 20px;display:flex;flex-direction:column;align-items:center;height:100%}
.logo{width:260px;height:260px;background:#E5E7EB;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 1px 1px #fff}
.logo .code{font-size:64px;font-weight:900;color:#4B5563;text-shadow: 1px 1px 0 #fff, 2px 2px 2px rgba(0,0,0,.2), 3px 3px 4px rgba(0,0,0,.2); letter-spacing:-2px}
.logo .name{font-size:26px;font-weight:800;color:#4B5563;text-shadow: 1px 1px 0 #fff, 2px 2px 3px rgba(0,0,0,.3); margin-top:10px; transform:rotate(-8deg)}
h1{font-size:28px;font-weight:900;color:#0A1931;margin:25px 0 28px}
input{width:100%;padding:18px 20px;border:1.5px solid #D1D5DB;border-radius:14px;margin-bottom:16px;background:#F9FAFB;outline:none}
.btn{width:100%;padding:19px;background:#0A1931;color:#fff;border:none;border-radius:100px;font-weight:700;margin-top:18px}
.oublie{margin-top:20px;color:#6B7280;font-size:13px}
</style>
</head>
<body>
<div class="iphone">
  <div class="notch"></div>
  <div class="screen">
    <div class="logo">
      <div class="code">&lt;/&gt;</div>
      <div class="name">Virt Tech</div>
    </div>
    <h1>CONNEXION</h1>
    <input placeholder="Adresse Email">
    <input type="password" placeholder="Mot de passe">
    <button class="btn">Se connecter</button>
    <p class="oublie">Mot de passe oublié ?</p>
  </div>
</div>
</body>
</html>
