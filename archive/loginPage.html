<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquette Virt_Dev</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Le fond gris clair qui met en valeur le téléphone */
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Le contour du téléphone */
        .phone {
            width: 320px;
            height: 650px;
            background-color: #000;
            border-radius: 45px;
            padding: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 0 0 2px #444;
            position: relative;
        }

        /* L'encoche */
        .notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 28px;
            background-color: #000;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }

        /* L'écran */
        .screen {
            background: linear-gradient(135deg, #ffffff 0%, #f0f4f8 100%);
            width: 100%;
            height: 100%;
            border-radius: 35px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .mockup-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Le logo (Image) */
        .mockup-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .mockup-title {
            color: #0B2545; /* Bleu nuit */
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* Les champs de saisie avec animation */
        .mockup-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            background: white;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Animation quand on clique dans le champ */
        .mockup-input:focus {
            border-color: #D4AF37; /* Doré */
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* Le bouton avec animation */
        .mockup-btn {
            width: 100%;
            padding: 14px;
            background-color: #0B2545; /* Bleu nuit */
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Animation au survol du bouton */
        .mockup-btn:hover {
            background-color: #D4AF37; /* Doré */
            color: #0B2545;
            transform: translateY(-2px);
        }

        .mockup-text {
            font-size: 0.85rem;
            color: #888;
            margin-top: 20px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .mockup-text:hover {
            color: #0B2545;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Structure du téléphone -->
    <div class="phone">
        <div class="notch"></div>
        <div class="screen">
            
            <!-- Contenu à reproduire -->
            <div class="mockup-content">
                <!-- L'image du logo -->
                <img src="logo.png" alt="Logo VirtTech" class="mockup-logo">
                
                <div class="mockup-title">CONNEXION</div>
                
                <input type="email" class="mockup-input" placeholder="Adresse Email">
                <input type="password" class="mockup-input" placeholder="Mot de passe">
                
                <button class="mockup-btn">Se connecter</button>
                
                <div class="mockup-text">Mot de passe oublié ?</div>
            </div>

        </div>
    </div>

</body>
</html>
