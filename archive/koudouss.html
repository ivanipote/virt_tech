<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Virt Tech - Connexion</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0a1931;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background-color: white;
      padding: 40px 30px;
      border-radius: 25px;
      width: 90%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .logo {
      width: 120px;
      height: 120px;
      background: #eee;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    h2 {
      color: #0a1931;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #0a1931;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .oublie {
      margin-top: 15px;
      font-size: 14px;
      color: gray;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo"> &lt;/&gt; Virt Tech</div>
    <h2>CONNEXION</h2>
    
    <input type="email" placeholder="Adresse Email">
    <input type="password" placeholder="Mot de passe">
    
    <button>Se connecter</button>
    
    <div class="oublie">Mot de passe oublié ?</div>
  </div>

</body>
</html>
